<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal a Brain Rot</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    
    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game',
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: '#FFB347',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 500 },
                    debug: false
                }
            },
            scene: {
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        
        let player;
        let brainRots = [];
        let coins = 0;
        let tsunami;
        let tsunamiActive = false;
        let touchLeft = false;
        let touchRight = false;

        function create() {
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;
            const scene = this;

            // Sky background
            this.cameras.main.setBackgroundColor('#FF8C00');

            // Clouds
            this.add.rectangle(w * 0.2, h * 0.1, 100, 30, 0xFFFFFF);
            this.add.rectangle(w * 0.7, h * 0.15, 100, 30, 0xFFFFFF);

            // Ground
            const ground = this.add.rectangle(w / 2, h - 30, w, 60, 0x8B4513);
            this.physics.add.existing(ground);
            ground.body.setImmovable(true);
            ground.body.setAllowGravity(false);

            // Player (RED)
            player = this.add.rectangle(w * 0.1, h - 100, 30, 40, 0xFF0000);
            this.physics.add.existing(player);
            player.body.setBounce(0.2);
            player.body.setCollideWorldBounds(true);
            this.physics.add.collider(player, ground);

            // Add some brain rots on screen
            for (let i = 0; i < 3; i++) {
                const br = this.add.rectangle(w * 0.2 + i * 150, h - 150, 40, 40, 0xFF00FF);
                this.physics.add.existing(br);
                br.data = { earnings: 10, level: 1 };
                br.setInteractive();
                br.on('pointerdown', () => {
                    coins += 50;
                    br.destroy();
                    brainRots = brainRots.filter(x => x !== br);
                });
                brainRots.push(br);
                this.physics.add.collider(br, ground);
            }

            // Tsunami
            tsunami = this.add.rectangle(-100, h / 2, 100, h, 0x0099FF);
            this.physics.add.existing(tsunami);
            tsunami.body.setAllowGravity(false);

            // Left/Right buttons
            const btnLeft = this.add.rectangle(50, h - 50, 80, 50, 0x00D9FF);
            const btnRight = this.add.rectangle(w - 50, h - 50, 80, 50, 0x00D9FF);
            btnLeft.setInteractive();
            btnRight.setInteractive();

            this.add.text(50, h - 50, '◀', { fontSize: '30px', fill: '#000' }).setOrigin(0.5, 0.5);
            this.add.text(w - 50, h - 50, '▶', { fontSize: '30px', fill: '#000' }).setOrigin(0.5, 0.5);

            btnLeft.on('pointerdown', () => { touchLeft = true; });
            btnLeft.on('pointerup', () => { touchLeft = false; });
            btnLeft.on('pointerout', () => { touchLeft = false; });

            btnRight.on('pointerdown', () => { touchRight = true; });
            btnRight.on('pointerup', () => { touchRight = false; });
            btnRight.on('pointerout', () => { touchRight = false; });

            // Jump on tap
            this.input.on('pointerdown', (p) => {
                if (p.y < h - 100 && player.body.touching.down) {
                    player.body.setVelocityY(-400);
                }
            });

            // UI
            this.add.text(10, 10, '💰 Coins: ' + coins, { fontSize: '20px', fill: '#000', fontStyle: 'bold' });
            this.add.text(w / 2, 10, '🧠 Steal a Brain Rot 🧠', { fontSize: '18px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5, 0);
            this.add.text(10, h - 80, 'Tap Brain Rots for $$ | Dodge Tsunami!', { fontSize: '14px', fill: '#000' });

            // Tsunami button
            const tsBtn = this.add.rectangle(w - 100, 50, 90, 40, 0x00FF00);
            tsBtn.setInteractive();
            this.add.text(w - 100, 50, 'Tsunami!', { fontSize: '14px', fill: '#000', fontStyle: 'bold' }).setOrigin(0.5, 0.5);
            tsBtn.on('pointerdown', () => {
                tsunamiActive = true;
                tsunami.x = -50;
                tsunami.body.setVelocityX(300);
            });

            scene.updateCoins = function() {
                coins += 1;
            };
        }

        function update() {
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;

            // Coins display
            if (Math.random() < 0.1) {
                brainRots.forEach(br => {
                    coins += br.data.earnings * 0.1;
                });
            }

            // Player movement
            if (touchLeft) {
                player.body.setVelocityX(-200);
            } else if (touchRight) {
                player.body.setVelocityX(200);
            } else {
                player.body.setVelocityX(0);
            }

            // Tsunami hit
            if (tsunamiActive && Phaser.Math.Distance.Between(player.x, player.y, tsunami.x, tsunami.y) < 80) {
                this.scene.restart();
            }

            // Stop tsunami
            if (tsunami.x > w) {
                tsunamiActive = false;
            }

            // Fall = die
            if (player.y > h) {
                this.scene.restart();
            }
        }
    </script>
</body>
</html>
