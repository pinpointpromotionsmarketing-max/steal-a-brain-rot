<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal a Brain Rot</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
        }
        #admin-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border: 2px solid #00FF00;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            max-width: 150px;
        }
        .admin-button {
            background: #00FF00;
            color: black;
            border: none;
            padding: 6px 8px;
            margin: 3px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
            font-size: 11px;
        }
        .admin-button:hover {
            background: #00DD00;
        }
        @media (max-width: 600px) {
            #admin-panel {
                font-size: 10px;
                padding: 8px;
            }
            .admin-button {
                padding: 4px 6px;
                font-size: 9px;
                margin: 2px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="admin-panel">
        <div><strong>ADMIN PANEL</strong></div>
        <div id="money-display">Coins: 0</div>
        <button class="admin-button" onclick="addCoins(1000)">+1000 Coins</button>
        <button class="admin-button" onclick="addCoins(10000)">+10000 Coins</button>
        <button class="admin-button" onclick="spawnBrainRot()">Spawn Brain Rot</button>
        <button class="admin-button" onclick="startTsunami()">Start Tsunami</button>
    </div>

    <script>
        let gameInstance;
        let gameCoins = 0;
        let player;
        let brainRots = [];
        let tsunami;
        let tsunamiActive = false;
        let gaps = [];
        let isHiding = false;

        function updateMoneyDisplay() {
            document.getElementById('money-display').textContent = `Coins: ${gameCoins}`;
        }

        function addCoins(amount) {
            gameCoins += amount;
            updateMoneyDisplay();
        }

        function spawnBrainRot() {
            if (gameInstance && gameInstance.scene.isActive()) {
                const x = Math.random() * 600 + 100;
                const y = 400;
                gameInstance.scene.scenes[0].spawnBrainRot(x, y);
            }
        }

        function startTsunami() {
            if (gameInstance && gameInstance.scene.isActive()) {
                gameInstance.scene.scenes[0].startTsunami();
            }
        }

        const isMobile = window.innerWidth < 800;
        const gameWidth = isMobile ? window.innerWidth : 1000;
        const gameHeight = isMobile ? window.innerHeight : 600;

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: gameWidth,
            height: gameHeight,
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            render: { 
                pixelArt: false,
                antialias: true
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: {
                create: create,
                update: update
            }
        };

        gameInstance = new Phaser.Game(config);

        function create() {
            const scene = this;
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;

            // Roblox-style sky
            this.cameras.main.setBackgroundColor('#FFB347');
            const bg = this.add.graphics();
            bg.fillGradientStyle(0xFF8C00, 0xFF8C00, 0xFFD700, 0xFFD700, 1);
            bg.fillRect(0, 0, w, h);
            bg.depth = -1;

            // Clouds
            this.add.rectangle(w * 0.15, h * 0.13, 150, 40, 0xFFFFFF);
            this.add.rectangle(w * 0.5, h * 0.17, 120, 35, 0xFFFFFF);
            this.add.rectangle(w * 0.8, h * 0.12, 140, 38, 0xFFFFFF);

            // Player (green square)
            player = this.add.rectangle(100, h - 150, 20, 30, 0x00FF00);
            this.physics.add.existing(player);
            player.body.setBounce(0);
            player.body.setCollideWorldBounds(true);

            // Base platform
            const basePlatform = this.add.rectangle(w / 2, h - 25, w, 50, 0x8B4513);
            this.physics.add.existing(basePlatform);
            basePlatform.body.setImmovable(true);
            basePlatform.body.setAllowGravity(false);
            this.physics.add.collider(player, basePlatform);

            // Create gaps (hide spots)
            gaps = [];
            const gapSpacing = (w - 300) / 5;
            for (let i = 0; i < 5; i++) {
                const gapX = 150 + (i * gapSpacing);
                const gap = { x: gapX, width: 80, hidden: false };
                gaps.push(gap);
                
                // Draw gap lines on platform
                const gapGraphics = this.add.graphics();
                gapGraphics.lineStyle(2, 0xFF0000);
                gapGraphics.lineBetween(gapX - 40, h - 50, gapX - 40, h - 25);
                gapGraphics.lineBetween(gapX + 40, h - 50, gapX + 40, h - 25);
            }

            // Create initial brain rots
            for (let i = 0; i < 3; i++) {
                this.spawnBrainRot(150 + i * (w / 4), h - 200);
            }

            // Tsunami (starts off-screen)
            tsunami = this.add.rectangle(-50, h / 2, 100, h, 0x0099FF);
            this.physics.add.existing(tsunami);
            tsunami.body.setAllowGravity(false);

            // UI Text
            const fontSize1 = isMobile ? '14px' : '18px';
            const fontSize2 = isMobile ? '10px' : '12px';
            this.add.text(10, 10, 'Earn Coins! Hide from Tsunami!', { fontSize: fontSize1, fill: '#FFFFFF', fontStyle: 'bold' });
            this.add.text(10, 35, isMobile ? 'Tap Rots to Upgrade | Use Buttons to Move | Tap to Jump' : 'Tap Brain Rots to Upgrade | Arrow Keys: Move | Tap to Jump', { fontSize: fontSize2, fill: '#FFFFFF' });

            // Input
            const cursors = this.input.keyboard.createCursorKeys();
            scene.touchLeft = false;
            scene.touchRight = false;
            
            this.input.keyboard.on('keydown-SPACE', () => {
                if (player.body.touching.down) {
                    player.body.setVelocityY(-300);
                }
            });
            
            // Touch buttons for mobile
            const btnY = h - 25;
            const leftBtn = this.add.rectangle(50, btnY, 80, 40, 0x00D9FF);
            const rightBtn = this.add.rectangle(w - 50, btnY, 80, 40, 0x00D9FF);
            leftBtn.setInteractive();
            rightBtn.setInteractive();
            
            this.add.text(50, btnY, '◄', { fontSize: '30px', fill: '#FFFFFF' }).setOrigin(0.5, 0.5);
            this.add.text(w - 50, btnY, '►', { fontSize: '30px', fill: '#FFFFFF' }).setOrigin(0.5, 0.5);
            
            leftBtn.on('pointerdown', () => { scene.touchLeft = true; });
            leftBtn.on('pointerup', () => { scene.touchLeft = false; });
            leftBtn.on('pointerout', () => { scene.touchLeft = false; });
            
            rightBtn.on('pointerdown', () => { scene.touchRight = true; });
            rightBtn.on('pointerup', () => { scene.touchRight = false; });
            rightBtn.on('pointerout', () => { scene.touchRight = false; });
            
            // Tap anywhere to jump
            this.input.on('pointerdown', (pointer) => {
                if (pointer.y < 500 && player.body.touching.down) {
                    player.body.setVelocityY(-300);
                }
            });
            
            // Store references
            scene.cursors = cursors;
            scene.spawnBrainRot = function(x, y) {
                const size = isMobile ? 25 : 30;
                const brainRot = scene.add.rectangle(x, y, size, size, 0xFF00FF);
                brainRot.data = {
                    level: 1,
                    earnings: 10,
                    x: x
                };
                brainRot.setInteractive();
                brainRot.on('pointerdown', () => {
                    if (gameCoins >= 50 * brainRot.data.level) {
                        gameCoins -= 50 * brainRot.data.level;
                        brainRot.data.level++;
                        brainRot.data.earnings += 10;
                        brainRot.setScale(1 + brainRot.data.level * 0.1);
                        brainRot.setTint(0xFF00FF - (brainRot.data.level * 0x111111));
                        updateMoneyDisplay();
                    }
                });
                brainRots.push(brainRot);
                return brainRot;
            };

            scene.startTsunami = function() {
                tsunamiActive = true;
                tsunami.x = -50;
                tsunami.body.setVelocityX(150);
            };

            updateMoneyDisplay();
        }

        function update() {
            const scene = this;

            // Player movement (keyboard + touch buttons)
            if (this.input.keyboard.keys[37] || this.cursors?.left.isDown || scene.touchLeft) { // Left arrow
                player.body.setVelocityX(-160);
            } else if (this.input.keyboard.keys[39] || this.cursors?.right.isDown || scene.touchRight) { // Right arrow
                player.body.setVelocityX(160);
            } else {
                player.body.setVelocityX(0);
            }

            // Earn money from brain rots
            brainRots.forEach(br => {
                gameCoins += br.data.earnings * 0.001; // Slow passive income
                if (Math.random() < 0.02) {
                    updateMoneyDisplay();
                }
            });

            // Check if player is in a gap (hiding)
            const h = scene.cameras.main.height;
            isHiding = false;
            gaps.forEach(gap => {
                if (player.x > gap.x - gap.width/2 && player.x < gap.x + gap.width/2 && player.y > h - 100) {
                    isHiding = true;
                    player.setAlpha(0.5); // Semi-transparent when hiding
                }
            });
            if (!isHiding) {
                player.setAlpha(1);
            }

            // Tsunami collision
            if (tsunamiActive && tsunami.x < 1000) {
                if (!isHiding && Phaser.Math.Distance.Between(player.x, player.y, tsunami.x, tsunami.y) < 80) {
                    // Hit by tsunami - restart
                    this.scene.restart();
                }
            }

            // Remove brain rots that fall off screen
            brainRots = brainRots.filter(br => br.active);

            // Stop tsunami after it passes
            const w = scene.cameras.main.width;
            if (tsunamiActive && tsunami.x > w) {
                tsunamiActive = false;
                tsunami.body.setVelocityX(0);
            }
        }
    </script>
</body>
</html>
