<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal a Brain Rot</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    
    <script>
        const gameConfig = {
            type: Phaser.AUTO,
            parent: 'game',
            width: window.innerWidth,
            height: window.innerHeight,
            backgroundColor: 0xFF8C00,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 400 },
                    debug: false
                }
            },
            scene: {
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(gameConfig);
        
        let player, brainRots = [], coins = 0, tsunami, isPaused = false;
        let touchLeft = false, touchRight = false, tsunamiSpeed = 0;

        function create() {
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;
            const scene = this;

            // Roblox orange/yellow sky
            this.cameras.main.setBackgroundColor(0xFF8C00);

            // Clouds
            this.add.rectangle(w * 0.1, h * 0.1, 120, 40, 0xFFFFFF);
            this.add.rectangle(w * 0.7, h * 0.12, 150, 50, 0xFFFFFF);
            this.add.rectangle(w * 0.4, h * 0.18, 100, 35, 0xFFFFFF);

            // Ground
            const ground = this.add.rectangle(w / 2, h - 40, w, 80, 0x8B4513);
            this.physics.add.existing(ground);
            ground.body.setImmovable(true);
            ground.body.setAllowGravity(false);

            // Player (red square - Roblox style)
            player = this.add.rectangle(w * 0.05, h - 120, 40, 50, 0xFF0000);
            this.physics.add.existing(player);
            player.body.setBounce(0.1);
            player.body.setCollideWorldBounds(true);
            this.physics.add.collider(player, ground);

            // Spawn brain rots (purple squares)
            for (let i = 0; i < 5; i++) {
                const br = this.add.rectangle(w * 0.15 + i * (w * 0.15), h - 150, 35, 35, 0xFF00FF);
                this.physics.add.existing(br);
                br.value = 10 + i * 5;
                br.setInteractive();
                br.on('pointerdown', () => {
                    coins += br.value;
                    br.destroy();
                    brainRots = brainRots.filter(x => x !== br);
                    updateDisplay();
                });
                brainRots.push(br);
                this.physics.add.collider(br, ground);
            }

            // Tsunami
            tsunami = this.add.rectangle(-60, h / 2, 120, h + 100, 0x00AAFF);
            this.physics.add.existing(tsunami);
            tsunami.body.setAllowGravity(false);
            tsunamiSpeed = 0;

            // UI Text
            this.add.text(w / 2, 15, '🧠 STEAL A BRAIN ROT 🧠', {
                fontSize: '24px',
                fill: '#000000',
                fontStyle: 'bold'
            }).setOrigin(0.5, 0);

            const coinsText = this.add.text(15, 15, '💰 0', {
                fontSize: '20px',
                fill: '#FFD700',
                fontStyle: 'bold'
            });
            scene.coinsText = coinsText;

            this.add.text(w / 2, h - 80, 'Collect Purple Blocks | Press Start Tsunami', {
                fontSize: '14px',
                fill: '#000000'
            }).setOrigin(0.5);

            // Control buttons
            const btnY = h - 50;
            
            // Left button
            const leftBtn = this.add.rectangle(50, btnY, 80, 50, 0x00D9FF);
            leftBtn.setInteractive();
            this.add.text(50, btnY, '◀', { fontSize: '28px', fill: '#000' }).setOrigin(0.5, 0.5);
            leftBtn.on('pointerdown', () => { touchLeft = true; });
            leftBtn.on('pointerup', () => { touchLeft = false; });
            leftBtn.on('pointerout', () => { touchLeft = false; });

            // Right button
            const rightBtn = this.add.rectangle(w - 50, btnY, 80, 50, 0x00D9FF);
            rightBtn.setInteractive();
            this.add.text(w - 50, btnY, '▶', { fontSize: '28px', fill: '#000' }).setOrigin(0.5, 0.5);
            rightBtn.on('pointerdown', () => { touchRight = true; });
            rightBtn.on('pointerup', () => { touchRight = false; });
            rightBtn.on('pointerout', () => { touchRight = false; });

            // Start tsunami button
            const startBtn = this.add.rectangle(w - 120, 50, 120, 50, 0x00FF00);
            startBtn.setInteractive();
            this.add.text(w - 120, 50, 'Start\nTsunami!', {
                fontSize: '12px',
                fill: '#000',
                fontStyle: 'bold',
                align: 'center'
            }).setOrigin(0.5, 0.5);
            startBtn.on('pointerdown', () => {
                if (tsunamiSpeed === 0) {
                    tsunamiSpeed = 250;
                }
            });

            // Jump on tap
            this.input.on('pointerdown', (p) => {
                if (p.y < h - 100 && player.body.touching.down) {
                    player.body.setVelocityY(-350);
                }
            });

            scene.updateDisplay = function() {
                scene.coinsText.setText('💰 ' + Math.floor(coins));
            };

            function updateDisplay() {
                scene.updateDisplay();
            }
        }

        function update() {
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;

            // Earn coins slowly
            coins += brainRots.length * 0.5;
            if (Math.random() < 0.05) {
                this.scene.scenes[0].updateDisplay();
            }

            // Player movement
            if (touchLeft) {
                player.body.setVelocityX(-200);
            } else if (touchRight) {
                player.body.setVelocityX(200);
            } else {
                player.body.setVelocityX(0);
            }

            // Tsunami movement
            if (tsunamiSpeed > 0) {
                tsunami.body.setVelocityX(tsunamiSpeed);
            }

            // Hit by tsunami
            if (Phaser.Math.Distance.Between(player.x, player.y, tsunami.x, tsunami.y) < 100) {
                this.scene.restart();
            }

            // Fall = death
            if (player.y > h + 100) {
                this.scene.restart();
            }
        }

        window.addEventListener('resize', () => {
            game.scale.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
