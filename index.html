<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal a Brain Rot</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #ui-panel {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border: 2px solid #FFD700;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
        }
        #admin-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border: 2px solid #00FF00;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            max-width: 150px;
        }
        button {
            background: #FFD700;
            color: black;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }
        button:hover {
            background: #FFC700;
        }
        .admin-button {
            background: #00FF00;
            color: black;
        }
        .admin-button:hover {
            background: #00DD00;
        }
        @media (max-width: 800px) {
            #ui-panel, #admin-panel {
                font-size: 11px;
                padding: 8px;
            }
            button {
                padding: 6px 10px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-panel">
        <div><strong>💰 Coins:</strong> <span id="coin-display">0</span></div>
        <div><strong>📦 Base Level:</strong> <span id="level-display">1</span></div>
        <div><strong>🧠 Brain Rots:</strong> <span id="count-display">0</span>/<span id="max-display">3</span></div>
        <button onclick="upgradBase()">⬆️ Upgrade Base</button>
        <button onclick="addBrainRot()">➕ Add Brain Rot</button>
    </div>

    <div id="admin-panel">
        <div><strong>ADMIN</strong></div>
        <button class="admin-button" onclick="adminCoins(5000)">+5K Coins</button>
        <button class="admin-button" onclick="startTsunami()">Start Tsunami</button>
    </div>

    <script>
        let gameInstance;
        let gameCoins = 0;
        let baseLevel = 1;
        let maxSlots = 3;
        let brainRots = [];
        let player;
        let baseDisplay;
        let tsunamiActive = false;
        let tsunami;

        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            width: window.innerWidth,
            height: window.innerHeight,
            scale: {
                mode: Phaser.Scale.RESIZE,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            render: { 
                pixelArt: false,
                antialias: true
            },
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            },
            scene: {
                create: create,
                update: update
            }
        };

        gameInstance = new Phaser.Game(config);

        function updateUI() {
            document.getElementById('coin-display').textContent = Math.floor(gameCoins);
            document.getElementById('level-display').textContent = baseLevel;
            document.getElementById('count-display').textContent = brainRots.length;
            document.getElementById('max-display').textContent = maxSlots;
        }

        function upgradBase() {
            if (gameCoins >= 500 * baseLevel) {
                gameCoins -= 500 * baseLevel;
                baseLevel++;
                maxSlots += 2;
                updateUI();
                if (gameInstance && gameInstance.scene.isActive()) {
                    gameInstance.scene.scenes[0].rebuildBase();
                }
            }
        }

        function addBrainRot() {
            if (brainRots.length < maxSlots && gameCoins >= 100) {
                gameCoins -= 100;
                brainRots.push({ level: 1, earnings: 5 });
                updateUI();
            }
        }

        function adminCoins(amount) {
            gameCoins += amount;
            updateUI();
        }

        function startTsunami() {
            if (gameInstance && gameInstance.scene.isActive()) {
                gameInstance.scene.scenes[0].startTsunami();
            }
        }

        function create() {
            const scene = this;
            const w = this.cameras.main.width;
            const h = this.cameras.main.height;

            // Roblox-style sky
            this.cameras.main.setBackgroundColor('#FFB347');
            const bg = this.add.graphics();
            bg.fillGradientStyle(0xFF8C00, 0xFF8C00, 0xFFD700, 0xFFD700, 1);
            bg.fillRect(0, 0, w, h);
            bg.depth = -1;

            // Clouds
            this.add.rectangle(w * 0.15, h * 0.1, 150, 40, 0xFFFFFF);
            this.add.rectangle(w * 0.5, h * 0.15, 120, 35, 0xFFFFFF);
            this.add.rectangle(w * 0.8, h * 0.08, 140, 38, 0xFFFFFF);

            // Player (green square)
            player = this.add.rectangle(100, h - 150, 20, 30, 0x00FF00);
            this.physics.add.existing(player);
            player.body.setBounce(0);
            player.body.setCollideWorldBounds(true);

            // Ground platform
            const ground = this.add.rectangle(w / 2, h - 40, w, 80, 0x8B4513);
            this.physics.add.existing(ground);
            ground.body.setImmovable(true);
            ground.body.setAllowGravity(false);
            this.physics.add.collider(player, ground);

            // Base tower
            scene.rebuildBase = function() {
                // Clear old base
                if (baseDisplay) {
                    baseDisplay.forEach(obj => obj.destroy());
                }
                baseDisplay = [];

                const baseX = w / 2 - 50;
                const slotSize = 40;
                const slotSpacing = 50;

                // Draw base structure
                for (let i = 0; i < maxSlots; i++) {
                    const slotY = h - 100 - (i * slotSpacing);
                    const slot = scene.add.rectangle(baseX, slotY, slotSize, slotSize, 0x654321);
                    slot.setStrokeStyle(2, 0xFFFFFF);
                    baseDisplay.push(slot);

                    // Add brain rot if exists
                    if (i < brainRots.length) {
                        const brainRot = scene.add.rectangle(baseX, slotY, slotSize - 10, slotSize - 10, 0xFF00FF);
                        brainRot.setInteractive();
                        brainRot.slotIndex = i;
                        
                        // Label shows level
                        const label = scene.add.text(baseX, slotY, 'Lv ' + brainRots[i].level, {
                            fontSize: '12px',
                            fill: '#FFFFFF'
                        }).setOrigin(0.5, 0.5);
                        baseDisplay.push(label);
                        baseDisplay.push(brainRot);

                        // Tap to sell
                        brainRot.on('pointerdown', () => {
                            gameCoins += 50 * brainRots[i].level;
                            brainRots.splice(i, 1);
                            updateUI();
                            scene.rebuildBase();
                        });
                    }
                }
            };

            scene.rebuildBase();

            // Tsunami
            tsunami = this.add.rectangle(-50, h / 2, 100, h, 0x0099FF);
            this.physics.add.existing(tsunami);
            tsunami.body.setAllowGravity(false);

            // Input
            scene.touchLeft = false;
            scene.touchRight = false;
            const btnY = h - 20;
            
            const leftBtn = this.add.rectangle(50, btnY, 80, 40, 0x00D9FF);
            const rightBtn = this.add.rectangle(w - 50, btnY, 80, 40, 0x00D9FF);
            leftBtn.setInteractive();
            rightBtn.setInteractive();
            
            this.add.text(50, btnY, '◀', { fontSize: '30px', fill: '#FFFFFF' }).setOrigin(0.5, 0.5);
            this.add.text(w - 50, btnY, '▶', { fontSize: '30px', fill: '#FFFFFF' }).setOrigin(0.5, 0.5);
            
            leftBtn.on('pointerdown', () => { scene.touchLeft = true; });
            leftBtn.on('pointerup', () => { scene.touchLeft = false; });
            leftBtn.on('pointerout', () => { scene.touchLeft = false; });
            
            rightBtn.on('pointerdown', () => { scene.touchRight = true; });
            rightBtn.on('pointerup', () => { scene.touchRight = false; });
            rightBtn.on('pointerout', () => { scene.touchRight = false; });
            
            // Jump on tap
            this.input.on('pointerdown', (pointer) => {
                if (pointer.y < h - 100 && player.body.touching.down) {
                    player.body.setVelocityY(-300);
                }
            });

            scene.startTsunami = function() {
                tsunamiActive = true;
                tsunami.x = -50;
                tsunami.body.setVelocityX(200);
            };

            // UI Text
            this.add.text(w / 2, 20, '🧠 STEAL A BRAIN ROT 🧠', { 
                fontSize: '20px', 
                fill: '#FFFFFF', 
                fontStyle: 'bold' 
            }).setOrigin(0.5, 0);
            this.add.text(w / 2, 50, 'Tap Brain Rots to SELL | Build your tower | Avoid tsunami!', { 
                fontSize: '12px', 
                fill: '#FFFFFF' 
            }).setOrigin(0.5, 0);

            updateUI();
        }

        function update() {
            const scene = this;
            const w = scene.cameras.main.width;
            const h = scene.cameras.main.height;

            // Player movement
            if (scene.touchLeft) {
                player.body.setVelocityX(-160);
            } else if (scene.touchRight) {
                player.body.setVelocityX(160);
            } else {
                player.body.setVelocityX(0);
            }

            // Earn money from brain rots
            brainRots.forEach(br => {
                gameCoins += br.earnings * 0.01;
            });
            if (Math.random() < 0.02) {
                updateUI();
            }

            // Tsunami collision
            if (tsunamiActive && tsunami.x < w) {
                if (Phaser.Math.Distance.Between(player.x, player.y, tsunami.x, tsunami.y) < 80) {
                    scene.scene.restart();
                }
            }

            // Stop tsunami
            if (tsunamiActive && tsunami.x > w) {
                tsunamiActive = false;
                tsunami.body.setVelocityX(0);
            }

            // Fall = die
            if (player.y > h + 50) {
                scene.scene.restart();
            }
        }

        window.addEventListener('resize', () => {
            gameInstance.scale.resize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
